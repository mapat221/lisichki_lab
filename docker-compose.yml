services:
  db:
    image: postgres:16-alpine
    container_name: lisichki_pg_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lisichki_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lisichki_backend
    restart: always
    environment:
      APP_ENV: development
      PYTHONPATH: /app/src
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/lisichki_db
      HASH_SCHEME: argon2id
      ARGON2_TIME_COST: 3
      ARGON2_MEMORY_COST: 65536
      ARGON2_PARALLELISM: 4
      PORT: 8000
      SECRET_KEY: "9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08"
      ADMIN_LOGIN: "admin"
      ADMIN_PASSWORD: "AdminPassword123!"
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lisichki_frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata: